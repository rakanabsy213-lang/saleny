<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سليني - Saleny</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a0b2e;
      color: #fce7f3;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* رسالة التنبيه العلوية */
    #toast {
      position: fixed; top: -70px; left: 50%; transform: translateX(-50%);
      background: #db2777; color: white; padding: 12px 24px; border-radius: 20px;
      font-weight: bold; z-index: 99999; transition: top 0.3s ease;
    }
    #toast.show { top: 20px; }

    /* النوافذ المنبثقة (Modal) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9); z-index: 10000;
      display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-box {
      background: #2e1065; border: 3px solid #db2777; border-radius: 25px;
      width: 100%; max-width: 380px; padding: 30px; text-align: center;
      box-shadow: 0 15px 35px rgba(219, 39, 119, 0.4);
    }
    .modal-box h2 { color: #fff; font-size: 20px; margin-bottom: 20px; line-height: 1.5; }

    .btn {
      display: block; width: 100%; padding: 12px; border-radius: 14px;
      font-size: 15px; font-weight: bold; cursor: pointer; border: none; margin-bottom: 12px;
    }
    .btn-insta {
      background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); color: white;
      text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-action { background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); }

    .btn-google { background: #fff; color: #333; }
    .btn-fb { background: #1877f2; color: #fff; }
    .btn-visitor { background: transparent; color: #fbcfe8; border: 1px solid #581c87; }

    /* الشاشة الرئيسية للعبة */
    #mainContent {
      display: none; padding: 40px 20px; text-align: center;
      background: linear-gradient(135deg, #701a75, #be185d); min-height: 100vh;
    }
  </style>
</head>
<body>

  <div id="toast">رسالة تنبيه</div>

  <!-- النافذة الأولى: قيد التطوير -->
  <div id="welcomeModal" class="modal-overlay">
    <div class="modal-box">
      <div style="font-size: 45px; color: #f472b6; margin-bottom: 15px;"><i class="fa-solid fa-screwdriver-wrench"></i></div>
      <h2>هذا الموقع قيد التطوير للاستفسار</h2>
      <a href="https://www.instagram.com/m__7_d_10" target="_blank" class="btn btn-insta">
        <i class="fa-brands fa-instagram" style="font-size: 18px;"></i>
        <span>التواصل عبر إنستغرام</span>
      </a>
      <button class="btn btn-action" onclick="goToLogin()">
        <span>حسناً، متابعة لتسجيل الدخول</span>
      </button>
    </div>
  </div>

  <!-- النافذة الثانية: تسجيل الدخول (مخفية بالكامل في البداية) -->
  <div id="loginModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <div style="font-size: 45px; color: #f472b6; margin-bottom: 15px;"><i class="fa-solid fa-user-shield"></i></div>
      <h2 style="margin-bottom: 8px;">تسجيل الدخول</h2>
      <p style="font-size: 13px; color: #d8b4fe; margin-bottom: 20px;">اختر طريقة تسجيل الدخول للمتابعة</p>
      
      <button class="btn btn-google" onclick="loginDone('Google')">
        <i class="fa-brands fa-google" style="color: #ea4335;"></i> المتابعة باستخدام Google
      </button>

      <button class="btn btn-fb" onclick="loginDone('Facebook')">
        <i class="fa-brands fa-facebook"></i> المتابعة باستخدام Facebook
      </button>

      <button class="btn btn-visitor" onclick="loginDone('زائر')">
        الدخول كزائر
      </button>
    </div>
  </div>

  <!-- الشاشة الرئيسية (تظهر بعد تسجيل الدخول) -->
  <div id="mainContent">
    <h1 style="font-size: 38px; color: #fff; margin-bottom: 10px;">لعبة سليني</h1>
    <p style="color: #fbcfe8; font-size: 18px;" id="userWelcomeText">مرحباً بك!</p>
  </div>

  <script>
    // الانتقال من نافذة الترحيب إلى نافذة تسجيل الدخول بوضوح
    function goToLogin() {
      const wel = document.getElementById('welcomeModal');
      const log = document.getElementById('loginModal');
      
      if (wel) wel.style.display = 'none'; // إخفاء نافذة قيد التطوير تماماً
      if (log) log.style.display = 'flex'; // إظهار نافذة تسجيل الدخول
    }

    // إتمام تسجيل الدخول والدخول للشاشة الرئيسية
    function loginDone(type) {
      const log = document.getElementById('loginModal');
      const main = document.getElementById('mainContent');
      
      if (log) log.style.display = 'none';
      if (main) main.style.display = 'block';
      
      document.getElementById('userWelcomeText').textContent = `مرحباً بك، ${type}!`;
      showToast(`تم الدخول بنجاح (${type})`);
    }

    function showToast(text) {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
