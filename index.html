<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختيار الفئات - سليني</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 50px;
        }

        .categories-container {
            max-width: 500px;
            margin: 0 auto;
            background: #2b2b2b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .category-btn {
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            border: 2px solid #444;
            background-color: #3b3b3b;
            color: #fff;
            transition: all 0.3s ease;
            border-radius: 8px;
        }

        /* شكل الزر عند اختياره */
        .category-btn.selected {
            background-color: #4CAF50;
            color: white;
            border-color: #388E3C;
            font-weight: bold;
            cursor: not-allowed;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        /* شكل الأزرار الباهتة عندما يتم الوصول للحد الأقصى (6 فئات) */
        .category-btn.dimmed {
            opacity: 0.3;
            cursor: not-allowed;
            background-color: #2a2a2a;
            border-color: #333;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #counter {
            font-size: 14px;
            color: #aaa;
        }

        .reset-btn {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .reset-btn:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

    <div class="categories-container">
        <h3>اختر الفئات الخاصة بك</h3>
        
        <div class="grid" id="buttonsGrid">
            <button class="category-btn" data-id="الرياضة" onclick="selectCategory(this)">فئة الرياضة</button>
            <button class="category-btn" data-id="التكنولوجيا" onclick="selectCategory(this)">فئة التكنولوجيا</button>
            <button class="category-btn" data-id="التاريخ" onclick="selectCategory(this)">فئة التاريخ</button>
            <button class="category-btn" data-id="العلوم" onclick="selectCategory(this)">فئة العلوم</button>
            <button class="category-btn" data-id="الجغرافيا" onclick="selectCategory(this)">فئة الجغرافيا</button>
            <button class="category-btn" data-id="الفن" onclick="selectCategory(this)">فئة الفن</button>
            <button class="category-btn" data-id="السينما" onclick="selectCategory(this)">فئة السينما</button>
            <button class="category-btn" data-id="الألعاب" onclick="selectCategory(this)">فئة الألعاب</button>
        </div>

        <div class="controls">
            <p id="counter">تم اختيار: 0 من 6</p>
            <button class="reset-btn" onclick="resetSelections()">إعادة التعيين</button>
        </div>
    </div>

    <script>
        const MAX_SELECTIONS = 6;
        let selectedCategories = JSON.parse(localStorage.getItem('selectedCategories')) || [];

        // تحديث الواجهة عند تحميل الصفحة بناءً على البيانات المحفوظة
        window.onload = function() {
            updateUI();
        };

        function selectCategory(button) {
            const categoryId = button.getAttribute('data-id');

            // إذا كان الزر مختاراً مسبقاً أو باهتًا، لا تفعل شيئاً
            if (button.classList.contains('selected') || button.classList.contains('dimmed')) {
                return;
            }

            // إذا لم نصل للحد الأقصى بعد
            if (selectedCategories.length < MAX_SELECTIONS) {
                selectedCategories.push(categoryId);
                localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
                updateUI();
            }
        }

        function updateUI() {
            const buttons = document.querySelectorAll('.category-btn');
            
            buttons.forEach(btn => {
                const categoryId = btn.getAttribute('data-id');
                
                // إعادة ضبط الحالة مبدئياً
                btn.classList.remove('selected', 'dimmed');

                if (selectedCategories.includes(categoryId)) {
                    btn.classList.add('selected');
                }
            });

            // تحديث العداد
            document.getElementById('counter').innerText = `تم اختيار: ${selectedCategories.length} من 6`;

            // إذا وصلنا للحد الأقصى، قم بتبهيت باقي الأزرار غير المختارة
            if (selectedCategories.length >= MAX_SELECTIONS) {
                buttons.forEach(btn => {
                    if (!btn.classList.contains('selected')) {
                        btn.classList.add('dimmed');
                    }
                });
            }
        }

        // دالة إعادة التعيين لمسح الاختيارات والبدء من جديد
        function resetSelections() {
            selectedCategories = [];
            localStorage.removeItem('selectedCategories');
            updateUI();
        }
    </script>

</body>
</html>
