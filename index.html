<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سليني - Saleny</title>
    <style>
        body {
            background-color: #701a75;
            font-family: Tahoma, sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .brand-header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 20px auto 0;
            width: fit-content;
        }
        .crown-icon {
            position: absolute;
            top: -38px;
            right: -10px;
            font-size: 45px;
            color: #f472b6;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            transform: rotate(-15deg);
        }
        html[dir="ltr"] .crown-icon {
            right: auto;
            left: -10px;
            transform: rotate(15deg);
        }
        h1 {
            font-size: 50px;
            color: #fbcfef;
            margin: 10px 0;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 19px;
            margin-top: 5px;
            color: #fbcfef;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .menu-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .menu-card {
            width: 130px;
            height: 150px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
        }
        .menu-card:hover {
            transform: translateY(-8px);
        }
        .menu-card span {
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
        .card-blue { background: linear-gradient(180deg, #db2777, #9d174d); }
        .card-yellow { background: linear-gradient(180deg, #c026d3, #86198f); }
        .card-play {
            background: #fbcfef;
            color: #701a75;
            border: 4px solid #ffffff;
            box-shadow: 0 12px 25px rgba(244, 63, 94, 0.4);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="brand-header-container">
        <div class="crown-icon">👑</div>
        <h1>سليني</h1>
        <div class="subtitle">اختبر معلوماتك ونافس أصدقائك</div>
    </div>

    <div class="menu-container">
        <div class="menu-card card-play">
            <span>ابدأ اللعبة</span>
        </div>
        <div class="menu-card card-blue">
            <span>البطولات</span>
        </div>
        <div class="menu-card card-yellow">
            <span>السجل</span>
        </div>
    </div>

</body>
</html>
