<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سليني</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8fafc;
      overflow-x: hidden;
    }

    /* رسالة التطوير قيد التطوير التي طلبت إرجاعها */
    #devNoticeBanner {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #ff7f00, #ff5500);
      color: white;
      padding: 14px 28px;
      border-radius: 35px;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(255,127,0,0.4);
      z-index: 9999;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 12px;
      border: 2px solid rgba(255,255,255,0.3);
    }
    #devNoticeBanner.show { top: 25px; }

    #toastNotification {
      position: fixed;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 9999;
      transition: top 0.4s ease-in-out;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #toastNotification.show { top: 85px; }

    .full-page-container {
      width: 100%;
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    .main-menu-card {
      background: #ffffff;
      border: 1px solid #f3f4f6;
      border-radius: 32px;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
      gap: 30px;
    }

    .app-logo-title {
      font-size: 44px;
      font-weight: 900;
      color: #ff7f00;
      letter-spacing: 1px;
    }

    .menu-buttons-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .menu-btn {
      width: 100%;
      background: #ff7f00;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,127,0,0.3);
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
    }

    .menu-btn:hover {
      background: #e67200;
      transform: translateY(-2px);
    }

    .menu-btn.secondary {
      background: #3b82f6;
      box-shadow: 0 4px 15px rgba(59,130,246,0.3);
    }
    .menu-btn.secondary:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <script>
    let isSoundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playClickSound() {
      if (!isSoundEnabled) return;
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function showToast(message) {
      const toast = document.getElementById('toastNotification');
      document.getElementById('toastText').textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // إظهار رسالة التطوير تلقائياً عند الدخول
    window.addEventListener('DOMContentLoaded', () => {
      const devBanner = document.getElementById('devNoticeBanner');
      setTimeout(() => {
        devBanner.classList.add('show');
      }, 500);
      setTimeout(() => {
        devBanner.classList.remove('show');
      }, 4000);
    });
  </script>

  <!-- رسالة التنبيه قيد التطوير -->
  <div id="devNoticeBanner">
    <i class="fa-solid fa-triangle-exclamation" style="font-size: 20px;"></i>
    <span>بطلت تيجي رسالة تزعجنيش بطور... التطبيق قيد التطوير!</span>
  </div>

  <div id="toastNotification">
    <i class="fa-solid fa-info-circle"></i>
    <span id="toastText">تنبيه</span>
  </div>

  <div class="full-page-container">
    <div class="main-menu-card">
      <div class="app-logo-title">سليني</div>
      
      <div class="menu-buttons-list">
        <button class="menu-btn" onclick="playClickSound(); showToast('الانتقال إلى تصفح الفئات')">
          <i class="fa-solid fa-layer-group"></i> تصفح الفئات
        </button>
        <button class="menu-btn secondary" onclick="playClickSound(); showToast('الانتقال لصفحة إنشاء لعبة')">
          <i class="fa-solid fa-plus-circle"></i> إنشاء لعبة جديدة
        </button>
      </div>
    </div>
  </div>

</body>
</html>
