<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سليني - Saleny</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a0b2e;
      color: #fce7f3;
      overflow-x: hidden;
    }

    /* نافذة الترحيب */
    #welcomeModal {
      display: flex;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-box {
      background: #2e1065;
      border: 3px solid #db2777;
      border-radius: 30px;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(219, 39, 119, 0.5);
    }
    .modal-box h2 { font-size: 20px; color: #fff; margin-bottom: 20px; line-height: 1.5; }
    
    .btn-main {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-bottom: 12px;
      transition: 0.2s;
    }
    .btn-insta {
      background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-close {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* نافذة تسجيل الدخول (مخفية افتراضياً عبر style="display:none;") */
    #loginModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 99998;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .btn-google { background: #fff; color: #333; }
    .btn-fb { background: #1877f2; color: #fff; }
    .btn-visitor { background: transparent; color: #fbcfe8; border: 1px solid #581c87; }

    /* الشاشة الرئيسية وبقية التصميم */
    #homeScreen {
      padding: 50px 20px;
      text-align: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #701a75, #be185d);
    }
  </style>
</head>
<body>

  <!-- نافذة الترحيب (تظهر عند فتح الصفحة) -->
  <div id="welcomeModal">
    <div class="modal-box">
      <div style="font-size: 50px; color: #f472b6; margin-bottom: 15px;"><i class="fa-solid fa-screwdriver-wrench"></i></div>
      <h2>هذا الموقع قيد التطوير للاستفسار</h2>
      <a href="https://www.instagram.com/m__7_d_10" target="_blank" class="btn-main btn-insta">
        <i class="fa-brands fa-instagram" style="font-size: 20px;"></i>
        <span>التواصل عبر إنستغرام</span>
      </a>
      <button class="btn-main btn-close" onclick="openLoginModal()">
        <span>حسناً، متابعة لتسجيل الدخول</span>
      </button>
    </div>
  </div>

  <!-- نافذة تسجيل الدخول (مخفية بالكامل ولا تظهر إلا عند الضغط على الزر أعلاه) -->
  <div id="loginModal">
    <div class="modal-box">
      <div style="font-size: 50px; color: #f472b6; margin-bottom: 15px;"><i class="fa-solid fa-user-shield"></i></div>
      <h2 style="margin-bottom: 8px;">تسجيل الدخول</h2>
      <p style="font-size: 13px; color: #d8b4fe; margin-bottom: 20px;">اختر طريقة تسجيل الدخول للمتابعة</p>
      
      <button class="btn-main btn-google" onclick="finishLogin('Google')">
        <i class="fa-brands fa-google" style="color: #ea4335;"></i> المتابعة باستخدام Google
      </button>

      <button class="btn-main btn-fb" onclick="finishLogin('Facebook')">
        <i class="fa-brands fa-facebook"></i> المتابعة باستخدام Facebook
      </button>

      <button class="btn-main btn-visitor" onclick="finishLogin('زائر')">
        الدخول كزائر
      </button>
    </div>
  </div>

  <!-- المحتوى الرئيسي للموقع -->
  <div id="homeScreen">
    <h1 style="font-size: 40px; color: #fff; margin-bottom: 10px;">لعبة سليني</h1>
    <p style="color: #fbcfe8; font-size: 18px;" id="welcomeUserText">مرحباً بك!</p>
  </div>

  <script>
    // دالة إغلاق الترحيب وإظهار تسجيل الدخول بقوة
    function openLoginModal() {
      const wel = document.getElementById('welcomeModal');
      const log = document.getElementById('loginModal');
      
      if (wel) {
        wel.style.display = 'none'; // إخفاء الترحيب تماماً
      }
      if (log) {
        log.style.display = 'flex'; // إظهار تسجيل الدخول كـ Flex في المنتصف
      }
    }

    // إتمام تسجيل الدخول وإخفاء النافذة
    function finishLogin(type) {
      const log = document.getElementById('loginModal');
      if (log) {
        log.style.display = 'none';
      }
      document.getElementById('welcomeUserText').textContent = `مرحباً بك، ${type}!`;
    }
  </script>
</body>
</html>
