<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">سليني - Saleny</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a0b2e;
      color: #fce7f3;
      overflow-x: hidden;
    }

    #toastNotification {
      position: fixed;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      background: #db2777;
      color: white;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(219, 39, 119, 0.4);
      z-index: 9999;
      transition: top 0.4s ease-in-out;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #toastNotification.show { top: 25px; }

    /* نافذة الترحيب والتنبيه عند الدخول */
    #welcomeModal {
      display: flex;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 20000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
      padding: 20px;
    }
    .welcome-content {
      background: #2e1065;
      border: 3px solid #db2777;
      border-radius: 35px;
      width: 100%;
      max-width: 420px;
      padding: 35px 25px 25px 25px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(219, 39, 119, 0.4);
      animation: popIn 0.4s ease-out;
      position: relative;
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .welcome-icon {
      font-size: 55px;
      color: #f472b6;
      margin-bottom: 15px;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .welcome-content h2 {
      font-size: 22px;
      color: #ffffff;
      margin-bottom: 20px;
      font-weight: 800;
      line-height: 1.6;
    }
    .insta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(220, 39, 67, 0.4);
      transition: transform 0.2s, opacity 0.2s;
      margin-bottom: 12px;
    }
    .insta-btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }
    .close-modal-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fce7f3;
      width: 100%;
      padding: 12px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .close-modal-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* نافذة الإدارة والرتب الحقيقية */
    #managementModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 15000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
      padding: 20px;
    }
    .management-content {
      background: #2e1065;
      border: 2px solid #db2777;
      border-radius: 30px;
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
    .management-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #581c87;
      padding-bottom: 12px;
    }
    .management-header h3 {
      font-size: 20px;
      color: #f472b6;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .admin-control-box {
      background: #3b0764;
      border: 1px solid #581c87;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .admin-control-box h4 {
      font-size: 16px;
      color: #fbcfe8;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      background: #1a0b2e;
      border: 1px solid #581c87;
      border-radius: 12px;
      color: #fce7f3;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #db2777;
    }
    .assign-btn {
      background: linear-gradient(90deg, #db2777, #9333ea);
      color: white;
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      transition: opacity 0.2s;
    }
    .assign-btn:hover { opacity: 0.9; }

    .assigned-users-list {
      margin-top: 15px;
      max-height: 180px;
      overflow-y: auto;
    }
    .user-rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a0b2e;
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid #581c87;
      font-size: 14px;
    }
    .delete-rank-btn {
      background: transparent;
      border: none;
      color: #f43f5e;
      cursor: pointer;
      font-size: 16px;
    }

    .rank-card {
      background: #3b0764;
      border: 1px solid #581c87;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 12px;
    }
    .rank-title {
      font-size: 17px;
      font-weight: bold;
      color: #fbcfe8;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rank-perms {
      font-size: 14px;
      color: #d8b4fe;
      line-height: 1.5;
    }

    /* الشاشة الرئيسية */
    #homeScreen {
      width: 100vw;
      min-height: 100vh;
      background: linear-gradient(135deg, #701a75 0%, #be185d 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .top-section {
      padding: 30px 20px 40px 20px;
      text-align: center;
      color: white;
      position: relative;
    }

    .icon-btn {
      position: absolute; 
      top: 25px; 
      background: rgba(255, 255, 255, 0.15); 
      border: 1px solid rgba(255, 255, 255, 0.3); 
      color: white; 
      width: 50px; 
      height: 50px; 
      border-radius: 50%; 
      font-size: 20px; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      backdrop-filter: blur(5px);
      transition: background 0.2s;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.3); }
    .sound-btn { left: 30px; }
    .settings-btn { right: 30px; }

    html[dir="ltr"] .sound-btn { left: auto; right: 30px; }
    html[dir="ltr"] .settings-btn { right: auto; left: 30px; }

    .brand-header-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 20px auto 0 auto;
      width: fit-content;
    }

    .crown-icon {
      position: absolute;
      top: -38px;
      right: -10px;
      font-size: 45px;
      color: #f472b6;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      transform: rotate(-15deg);
    }
    html[dir="ltr"] .crown-icon { right: auto; left: -10px; transform: rotate(15deg); }
    
    .brand-logo-svg {
      width: 280px;
      height: 80px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
    }

    .subtitle { 
      font-size: 16px; 
      margin-top: 5px; 
      font-weight: 700; 
      color: #fbcfe8; 
      text-shadow: 0 2px 4px rgba(0,0,0,0.2); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
    }
    
    .subtitle span { color: #f472b6; font-size: 18px; }

    /* شبكة القائمة الرئيسية */
    .main-menu { 
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 420px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 10;
    }

    .menu-card { 
      width: 100%; 
      height: 110px; 
      border-radius: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      color: white; 
      box-shadow: 0 8px 15px rgba(0,0,0,0.2); 
      cursor: pointer; 
      transition: transform 0.2s; 
    }
    .menu-card:hover { transform: translateY(-4px); }
    .menu-card i { font-size: 26px; margin-bottom: 6px; }
    .menu-card span { font-size: 13px; font-weight: bold; text-align: center; }

    .card-play { 
      background: linear-gradient(180deg, #f43f5e, #be123c); 
      grid-column: span 3;
      height: 120px; 
      border-radius: 24px; 
      border: 3px solid #fbcfe8; 
      box-shadow: 0 10px 20px rgba(244, 63, 94, 0.4); 
      position: relative;
    }
    .card-play i { font-size: 36px; color: #ffffff; }
    .card-play span { font-size: 16px; font-weight: 900; }

    .card-blue { background: linear-gradient(180deg, #db2777, #9d174d); }
    .card-yellow { background: linear-gradient(180deg, #c026d3, #86198f); }
    .card-green { background: linear-gradient(180deg, #e11d48, #9f1239); }
    .card-white { background: #3b0764; color: #fce7f3; border: 1px solid #581c87; }
    .card-dark { background: #2e1065; color: #ffffff; border: 1px solid #581c87; }
    .card-cyan { background: linear-gradient(180deg, #9333ea, #6b21a8); }

    .home-bottom-bg { 
      background: #2e1065; 
      width: 100%; 
      padding: 30px 20px 20px 20px;
      display: flex; flex-direction: column; align-items: center;
      margin-top: 25px;
      border-top: 1px solid #581c87;
    }

    .features-container {
      display: flex; justify-content: center; gap: 30px; max-width: 1200px; width: 100%; flex-wrap: wrap; margin-bottom: 20px;
    }

    .feature-item { display: flex; align-items: center; gap: 12px; }
    html[dir="rtl"] .feature-item { direction: rtl; }
    html[dir="ltr"] .feature-item { direction: ltr; }

    .feature-icon-circle {
      width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
    }
    .f-red { background: rgba(244, 63, 94, 0.15); color: #f43f5e; }
    .f-yellow { background: rgba(192, 38, 211, 0.15); color: #e879f9; }
    .feature-text h4 { font-size: 14px; font-weight: 800; color: #fce7f3; margin-bottom: 2px; }
    .feature-text p { font-size: 12px; color: #d8b4fe; font-weight: 600; }
    html[dir="rtl"] .feature-text { text-align: right; }
    html[dir="ltr"] .feature-text { text-align: left; }
