<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سليني - إنشاء لعبة</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff;
      overflow-x: hidden;
    }

    #toastNotification {
      position: fixed;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff7f00;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 9999;
      transition: top 0.4s ease-in-out;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #toastNotification.show { top: 25px; }

    .full-page-container {
      width: 100%;
      min-height: 100vh;
      background: rgba(255, 255, 255, 0.98);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 40px 20px;
      position: relative;
    }

    .create-game-dialog {
      background: #ffffff;
      border: 1px solid #f3f4f6;
      border-radius: 32px;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
      overflow: hidden;
      position: relative;
      padding-bottom: 40px;
    }

    .back-btn {
      position: absolute;
      top: 28px;
      right: 30px;
      background: #e5e7eb;
      border: none;
      color: #6b7280;
      width: 40px; 
      height: 40px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
      z-index: 10;
      text-decoration: none;
    }
    .back-btn:hover { background: #d1d5db; color: #374151; }

    .header-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 20px 20px 20px;
    }
    .pill-title {
      background: #ff7f00;
      color: white;
      font-size: 24px;
      font-weight: 800;
      padding: 10px 55px;
      border-radius: 35px;
      box-shadow: 0 4px 15px rgba(255,127,0,0.3);
      letter-spacing: 0.5px;
    }

    .form-content {
      padding: 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-weight: 700;
      color: #374151;
      font-size: 16px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      background: #f9fafb;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: #ff7f00;
      background: #ffffff;
    }

    .submit-game-btn {
      margin-top: 10px;
      background: #ff7f00;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,127,0,0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .submit-game-btn:hover {
      background: #e67200;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <script>
    let isSoundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playClickSound() {
      if (!isSoundEnabled) return;
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function showToast(message) {
      const toast = document.getElementById('toastNotification');
      document.getElementById('toastText').textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    function handleCreateSubmit(e) {
      e.preventDefault();
      playClickSound();
      showToast('تم إنشاء اللعبة بنجاح!');
    }
  </script>

  <div id="toastNotification">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <span id="toastText">تنبيه</span>
  </div>

  <div class="full-page-container">
    <div class="create-game-dialog">
      <a href="javascript:history.back()" class="back-btn" title="رجوع" onclick="playClickSound()"><i class="fa-solid fa-minus"></i></a>
      
      <div class="header-bar">
        <div class="pill-title">إنشاء لعبة جديدة</div>
      </div>

      <form class="form-content" onsubmit="handleCreateSubmit(event)">
        <div class="form-group">
          <label for="gameTitle">عنوان اللعبة</label>
          <input type="text" id="gameTitle" placeholder="أدخل عنوان اللعبة هنا..." required>
        </div>

        <div class="form-group">
          <label for="gameCategory">فئة اللعبة</label>
          <input type="text" id="gameCategory" placeholder="مثال: معلومات عامة، تحدي..." required>
        </div>

        <div class="form-group">
          <label for="gameDesc">وصف اللعبة</label>
          <textarea id="gameDesc" rows="4" placeholder="اكتب وصفاً قصيراً أو تفاصيل اللعبة..."></textarea>
        </div>

        <button type="submit" class="submit-game-btn">حفظ وإنشاء اللعبة</button>
      </form>
    </div>
  </div>

</body>
</html>
