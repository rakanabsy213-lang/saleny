<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة سليني</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #8b1552, #5a0c35);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
        }

        /* شارة حالة الدخول */
        .status-badge {
            background-color: #e91e63;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            display: inline-block;
        }

        /* عنوان اللعبة */
        .game-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* رسالة الترحيب */
        .welcome-text {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        /* حاوية الأزرار أو الخيارات المستقبلية */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            background-color: #ffffff;
            color: #8b1552;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- شارة الدخول -->
        <div class="status-badge">
            تم الدخول بنجاح (زائر)
        </div>

        <!-- عنوان اللعبة -->
        <h1 class="game-title">لعبة سليني</h1>

        <!-- نص الترحيب -->
        <p class="welcome-text">مرحباً بك، زائر!</p>

        <!-- أزرار تفاعلية (اختيارية لبدء اللعب) -->
        <div class="action-buttons">
            <button class="btn" onclick="startGame()">ابدأ اللعب</button>
        </div>
    </div>

    <script>
        function startGame() {
            console.log("تم بدء اللعبة بنجاح!");
            // يمكنك إضافة وظائف الانتقال للأقسام أو الألعاب هنا
        }
    </script>

</body>
</html>
